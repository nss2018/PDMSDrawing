# nginx-pdms.conf - reverse proxy for pdmsDrawing cloud relay
# page/uploads/payload -> relay HTTP 8766 ; /ws -> relay WS 8765
# put into /etc/nginx/sites-available/ and symlink to sites-enabled,
# then: certbot --nginx (for real TLS) or use your own certs.

server {
    listen 80;
    server_name pdms.example.com;      # EDIT: your domain

    # page + uploads + payload (relay http-port)
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # websocket (relay ws-port) - browser wss://domain/ws and agent wss
    location /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;      # long-lived agent connections
        proxy_send_timeout 3600s;
    }
}

# after certbot adds TLS, the same locations work as-is on 443;
# browser page then auto-connects wss://domain/ws (built into index.html),
# and the local agent uses: python agent.py --url wss://pdms.example.com/ws --token ...
