# pdms-locations.conf - paste INTO the api.yuansutansuo.ltd server{} block
# (BT panel: 网站设置 -> 配置文件; plain nginx: the site's vhost conf).
# Serves the pdmsDrawing platform at https://api.yuansutansuo.ltd/pdms/
# Relay listens on 127.0.0.1 only - nothing new exposed to the internet.

    # PDMS platform page / uploads / payload -> relay HTTP (prefix passed through)
    location /pdms/ {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /pdms { return 301 /pdms/; }

    # PDMS websocket -> relay WS (same-origin, page auto-connects /pdms/ws)
    location /pdms/ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
